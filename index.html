<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>مسابقة السرعة</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, get, set, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCkpZGifmEtUZDO6JVIrxcm1K_VN9BfC8k",
    authDomain: "quiz-mharat.firebaseapp.com",
    databaseURL: "https://quiz-mharat-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "quiz-mharat",
    storageBucket: "quiz-mharat.firebasestorage.app",
    messagingSenderId: "66351279972",
    appId: "1:66351279972:web:558929d2ede8cf58ca9471"
  };

  try{
    const fbApp = initializeApp(firebaseConfig);
    const db = getDatabase(fbApp);
    window.__fb = { ref, get, set, remove, db };
    window.__fbReady = true;
    window.dispatchEvent(new Event('fbready'));
  }catch(e){
    console.error('Firebase init failed', e);
    document.getElementById('app').innerHTML =
      '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:#ff3b4e;font-weight:800;">تعذر الاتصال بقاعدة البيانات. تحقق من الإنترنت وأعد تحميل الصفحة.</div>';
  }
</script>
<style>
  :root{
    --ink:#f4f5fa;
    --ink2:#ffffff;
    --panel:#ffffff;
    --line:rgba(20,25,50,.10);
    --txt:#1a1e33;
    --dim:#6b7094;
    --blue:#2d6cff;
    --red:#ff3b4e;
    --yellow:#ffc22e;
    --green:#1fd67a;
    --gold:#e0a400;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:
      radial-gradient(1200px 800px at 15% -10%, #e8ecff 0%, transparent 55%),
      radial-gradient(1000px 700px at 110% 10%, #ffe9f5 0%, transparent 50%),
      var(--ink);
    color:var(--txt);
    font-family:'Segoe UI', Tahoma, Arial, sans-serif;
    min-height:100%;
    overflow-x:hidden;
  }
  .display-face{
    font-family: 'Arial Black', 'Segoe UI', sans-serif;
    font-weight:900;
    letter-spacing:.5px;
  }
  #app{min-height:100vh;display:flex;flex-direction:column;}
  .hidden{display:none !important;}

  .center-col{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px; text-align:center;
  }
  .btn{
    appearance:none; border:none; cursor:pointer;
    background:linear-gradient(180deg,#3355ff,#2540c9);
    color:#fff; font-weight:800; font-size:17px;
    padding:14px 26px; border-radius:14px;
    box-shadow:0 6px 0 #17257a, 0 10px 24px rgba(45,108,255,.35);
    transition:transform .08s ease;
  }
  .btn:active{transform:translateY(4px); box-shadow:0 2px 0 #17257a;}
  .btn.ghost{
    background:transparent; color:var(--txt);
    border:1.5px solid var(--line); box-shadow:none;
  }
  .btn.danger{background:linear-gradient(180deg,#ff5468,#c81f34); box-shadow:0 6px 0 #7a0f1d,0 10px 24px rgba(255,59,78,.3);}
  .btn.small{padding:9px 16px; font-size:14px; border-radius:10px;}
  .btn:disabled{opacity:.4; cursor:not-allowed;}

  input[type=text]{
    background:#eef0fb; border:1.5px solid var(--line); color:var(--txt);
    font-size:16px; padding:12px 14px; border-radius:12px; outline:none;
    width:100%;
  }
  input[type=text]:focus{border-color:var(--blue);}
  textarea{
    background:#eef0fb; border:1.5px solid var(--line); color:var(--txt);
    font-size:15px; padding:10px 12px; border-radius:10px; outline:none; width:100%;
    font-family:inherit; resize:vertical;
  }
  label{font-size:13px; color:var(--dim); font-weight:700; display:block; margin-bottom:6px;}

  .logo-row{display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:6px;}
  .logo-dot{width:14px;height:14px;border-radius:4px;}
  .brand{
    font-size:15px; letter-spacing:3px; color:var(--dim); font-weight:800; text-transform:uppercase;
  }

  .role-card{
    background:var(--panel); border:1px solid var(--line); border-radius:20px;
    padding:34px 30px; max-width:440px; width:100%;
  }
  h1.title{
    font-size:38px; margin:6px 0 4px; line-height:1.15;
  }
  .subtitle{color:var(--dim); font-size:15px; margin-bottom:26px;}
  .role-btns{display:flex; flex-direction:column; gap:12px;}

  .lobby-wrap{flex:1; display:flex; flex-direction:column; align-items:center; padding:30px 20px; gap:18px;}
  .qr-card{
    background:#fff; padding:16px; border-radius:20px; box-shadow:0 20px 60px rgba(0,0,0,.4);
  }
  #qrcode img{display:block; border-radius:6px;}
  .join-link{
    font-size:16px; color:var(--dim); background:#eef0fb; border:1px solid var(--line);
    padding:8px 16px; border-radius:10px; direction:ltr; letter-spacing:.5px;
  }
  .players-grid{
    display:flex; flex-wrap:wrap; gap:12px; justify-content:center; max-width:1000px; margin-top:6px;
  }
  .player-chip{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:12px 20px; font-weight:800; font-size:17px;
    animation:pop .35s ease;
  }
  @keyframes pop{from{transform:scale(.6);opacity:0;} to{transform:scale(1);opacity:1;}}
  @keyframes confettiFall{
    0%{ transform:translateY(0) rotate(0deg); opacity:1; }
    100%{ transform:translateY(115vh) rotate(540deg); opacity:.3; }
  }
  @keyframes fadeInUp{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes podiumPop{
    0%{ opacity:0; transform:scale(.6) translateY(20px); }
    70%{ opacity:1; transform:scale(1.08) translateY(-4px); }
    100%{ opacity:1; transform:scale(1) translateY(0); }
  }
  .podium-reveal{ animation: podiumPop .6s cubic-bezier(.34,1.56,.64,1) forwards; }
  .winner-pop .podium-block{ animation: winnerGlow 1.4s ease-in-out infinite; }
  @keyframes winnerGlow{
    0%,100%{ box-shadow:0 0 0 rgba(255,209,102,0); }
    50%{ box-shadow:0 0 40px rgba(255,209,102,.7); }
  }
  .count-pill{
    background:var(--gold); color:#2a1c00; font-weight:900; padding:6px 18px; border-radius:999px; font-size:14px;
  }
  .chip-remove{
    background:rgba(255,59,78,.15); color:var(--red); border:1px solid rgba(255,59,78,.4);
    border-radius:50%; width:22px; height:22px; font-size:13px; font-weight:900; line-height:1;
    cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;
  }
  .bonus-btn{
    background:rgba(255,209,102,.15); color:var(--gold); border:1px solid rgba(255,209,102,.4);
    border-radius:10px; padding:6px 12px; font-size:12px; font-weight:800; cursor:pointer; white-space:nowrap;
  }
  .bonus-btn.active{background:var(--gold); color:#2a1c00;}
  .bonus-btn:disabled{opacity:.3; cursor:not-allowed;}
  .skip-btn{
    background:rgba(255,59,78,.12); color:var(--red); border:1px solid rgba(255,59,78,.4);
    border-radius:10px; padding:6px 14px; font-size:13px; font-weight:800; cursor:pointer;
  }
  .boost-banner{
    background:rgba(255,209,102,.12); border:1px solid rgba(255,209,102,.4); color:var(--gold);
    border-radius:12px; padding:8px 14px; font-size:13px; font-weight:800; text-align:center;
  }

  .stage{flex:1; display:flex; flex-direction:column; padding:20px 28px; gap:14px;}
  .stage-top{display:flex; align-items:center; justify-content:space-between;}
  .qnum{color:var(--dim); font-weight:800; letter-spacing:1px; font-size:14px;}
  .timer-wrap{display:flex; align-items:center; gap:10px;}
  .timer-ring{
    width:56px;height:56px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-weight:900; font-size:20px;
    background:conic-gradient(var(--green) calc(var(--pct)*1%), #e3e6f4 0);
    position:relative;
  }
  .timer-ring::before{
    content:""; position:absolute; inset:5px; border-radius:50%; background:var(--ink2);
  }
  .timer-num{position:relative; z-index:1;}
  .answered-pill{
    background:var(--ink2); border:1px solid var(--line); padding:6px 14px; border-radius:999px;
    font-size:13px; font-weight:800; color:var(--dim);
  }
  .qbox{
    background:var(--panel); border:1px solid var(--line); border-radius:20px;
    padding:34px 40px; text-align:center; font-size:clamp(24px,3.4vw,42px); font-weight:800;
    line-height:1.35; min-height:120px; display:flex; align-items:center; justify-content:center;
  }
  .answers-grid{
    flex:1; display:grid; grid-template-columns:1fr 1fr; gap:16px; min-height:0;
  }
  .answer-tile{
    border-radius:20px; padding:20px 26px; display:flex; align-items:center; gap:16px;
    font-size:clamp(18px,2.1vw,26px); font-weight:800; position:relative; overflow:hidden;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.12), 0 12px 30px rgba(0,0,0,.35);
  }
  .answer-tile .shape{
    width:34px;height:34px;flex:0 0 auto; display:flex;align-items:center;justify-content:center;
  }
  .answer-tile.correct-reveal{outline:5px solid #fff; transform:scale(1.02);}
  .answer-tile.dim-reveal{opacity:.35;}
  .tile-blue{background:linear-gradient(135deg,#3a6bff,#1f3fb0);}
  .tile-red{background:linear-gradient(135deg,#ff5064,#c31d2e);}
  .tile-yellow{background:linear-gradient(135deg,#ffd35c,#e0982a); color:#2a1c00;}
  .tile-green{background:linear-gradient(135deg,#33e08e,#159a58);}
  .count-badge{
    position:absolute; left:14px; top:14px; background:rgba(0,0,0,.35); border-radius:999px;
    padding:4px 12px; font-size:14px; font-weight:900;
  }

  .results-wrap{flex:1; display:flex; flex-direction:column; align-items:center; padding:26px; gap:16px;}
  .scoreboard{width:100%; max-width:760px; display:flex; flex-direction:column; gap:10px;}
  .score-row{
    display:flex; align-items:center; gap:14px; background:var(--panel); border:1px solid var(--line);
    border-radius:14px; padding:12px 18px;
  }
  .score-rank{
    width:34px;height:34px;border-radius:50%; background:#eef0fb; display:flex;align-items:center;justify-content:center;
    font-weight:900; font-size:15px; flex:0 0 auto; color:var(--dim);
  }
  .score-row.rank-1 .score-rank{background:var(--gold); color:#2a1c00;}
  .score-name{flex:1; font-weight:800; font-size:17px; text-align:right;}
  .score-delta{color:var(--green); font-weight:800; font-size:14px; min-width:64px; text-align:left;}
  .score-total{font-weight:900; font-size:19px; min-width:64px; text-align:left;}
  .move-arrow{
    min-width:44px; text-align:center; font-size:26px; font-weight:900;
    display:flex; align-items:center; justify-content:center; gap:2px;
  }
  .score-row{ will-change: transform; }

  .podium-wrap{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:30px; gap:30px;}
  .podium{display:flex; align-items:flex-end; gap:18px;}
  .podium-col{display:flex; flex-direction:column; align-items:center; gap:10px; width:150px;}
  .podium-name{font-weight:900; font-size:18px;}
  .podium-score{color:var(--dim); font-weight:700; font-size:14px;}
  .podium-block{
    width:100%; border-radius:14px 14px 0 0; display:flex; align-items:flex-start; justify-content:center;
    padding-top:14px; font-size:34px; font-weight:900;
  }
  .p1 .podium-block{height:180px; background:linear-gradient(180deg,#ffe08a,#ffb62e); color:#2a1c00;}
  .p2 .podium-block{height:140px; background:linear-gradient(180deg,#d8dcf0,#9aa2c9); color:#1a1e33;}
  .p3 .podium-block{height:110px; background:linear-gradient(180deg,#e8b27a,#b06a37); color:#2a1400;}
  .medal{font-size:30px;}
  .rest-list{width:100%; max-width:520px; display:flex; flex-direction:column; gap:8px;}

  .setup-wrap{flex:1; padding:22px; max-width:820px; margin:0 auto; width:100%;}
  .qcard{
    background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:14px;
  }
  .qcard-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .qcard-num{font-weight:900; color:var(--gold);}
  .opt-row{display:flex; align-items:center; gap:10px; margin-top:8px;}
  .opt-color{width:22px;height:22px;border-radius:6px; flex:0 0 auto;}
  .opt-color.c-blue{background:var(--blue);} .opt-color.c-red{background:var(--red);}
  .opt-color.c-yellow{background:var(--yellow);} .opt-color.c-green{background:var(--green);}
  .radio-correct{width:20px;height:20px; accent-color: var(--green); flex:0 0 auto; cursor:pointer;}
  .setup-toolbar{
    position:sticky; top:0; z-index:5; background:rgba(255,255,255,.92); backdrop-filter:blur(6px);
    padding:14px 0; display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--line); margin-bottom:16px;
  }
  .progress-pill{font-weight:800; color:var(--dim); font-size:14px;}

  .player-wrap{flex:1; display:flex; flex-direction:column;}
  .waiting-box{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:20px;}
  .pulse-dot{width:16px;height:16px;border-radius:50%;background:var(--green); animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{opacity:.3;transform:scale(.9);} 50%{opacity:1;transform:scale(1.15);}}
  .colors-grid{
    flex:1; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:12px; padding:14px;
  }
  .color-btn{
    border:none; border-radius:22px; display:flex; align-items:center; justify-content:center;
    font-size:0; box-shadow:0 8px 0 rgba(0,0,0,.25);
  }
  .color-btn:active{transform:translateY(6px); box-shadow:none;}
  .color-btn.c-blue{background:linear-gradient(160deg,#3a6bff,#1f3fb0);}
  .color-btn.c-red{background:linear-gradient(160deg,#ff5064,#c31d2e);}
  .color-btn.c-yellow{background:linear-gradient(160deg,#ffd35c,#e0982a);}
  .color-btn.c-green{background:linear-gradient(160deg,#33e08e,#159a58);}
  .shape-svg{width:38%; height:38%;}
  .locked-msg{font-size:20px; font-weight:800; padding:20px;}
  .my-score{font-size:15px; color:var(--dim); margin-top:4px;}
  .player-name-tag{font-weight:900; font-size:20px;}

  @media (max-width:720px){
    .answers-grid{grid-template-columns:1fr;}
    .podium{gap:10px;}
    .podium-col{width:100px;}
  }
</style>
</head>
<body>
<div id="app">
  <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px;">
    <div class="pulse-dot" style="background:#2d6cff;"></div>
    <p style="color:#8b90b3; font-weight:700;">جارِ الاتصال...</p>
  </div>
</div>

<script>
const COLORS = ["blue","red","yellow","green"];
const COLOR_HEX = {blue:"#2d6cff", red:"#ff3b4e", yellow:"#ffc22e", green:"#1fd67a"};
const QUESTION_TIME = 60;

function uid(){ return 'p_' + Math.random().toString(36).slice(2,10); }
function getParam(name){ const u = new URL(window.location.href); return u.searchParams.get(name); }

function fbPath(key){
  const m = String(key).match(/^quiz:answers:(\d+)$/);
  if(m) return 'quiz_answers/' + m[1];
  return String(key).replace(/[.#$\[\]:]/g, '_');
}

async function safeGet(key, shared){
  try{
    const { ref, get, db } = window.__fb;
    const snap = await get(ref(db, fbPath(key)));
    if(!snap.exists()) return null;
    const val = snap.val();
    return typeof val === 'string' ? JSON.parse(val) : val;
  }catch(e){ console.error('fb get failed', key, e); return null; }
}
async function safeSet(key, value, shared){
  try{
    const { ref, set, db } = window.__fb;
    await set(ref(db, fbPath(key)), JSON.stringify(value));
    return true;
  }catch(e){ console.error('fb set failed', key, e); return false; }
}

function shapeSVG(color){
  const shapes = {
    blue: '<svg class="shape-svg" viewBox="0 0 24 24" fill="#fff"><path d="M12 2 L22 22 L2 22 Z"/></svg>',
    red: '<svg class="shape-svg" viewBox="0 0 24 24" fill="#fff"><rect x="4" y="4" width="16" height="16" rx="3"/></svg>',
    yellow: '<svg class="shape-svg" viewBox="0 0 24 24" fill="#2a1c00"><circle cx="12" cy="12" r="10"/></svg>',
    green: '<svg class="shape-svg" viewBox="0 0 24 24" fill="#fff"><path d="M12 2 L15 9 L22 9.5 L16.5 14 L18.5 21 L12 17 L5.5 21 L7.5 14 L2 9.5 L9 9 Z"/></svg>'
  };
  return shapes[color];
}

let __audioCtx = null;
function playBeep(freq, duration){
  try{
    if(!__audioCtx) __audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = __audioCtx;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  }catch(e){ }
}

const app = document.getElementById('app');
const isPlayer = getParam('player') === '1';

function boot(){
  if(isPlayer){ renderPlayerApp(); } else { renderHostApp(); }
}
if(window.__fbReady){ boot(); } else { window.addEventListener('fbready', boot, {once:true}); }

async function renderHostApp(){
  let session = await safeGet('quiz:session', true);
  if(!session){
    session = {state:'setup', currentIndex:-1, questionStartedAt:null, revealed:false};
    await safeSet('quiz:session', session, true);
  }
  route();

  async function route(){
    session = await safeGet('quiz:session', true) || session;
    if(session.state === 'setup') return renderSetup();
    if(session.state === 'lobby') return renderLobby();
    if(session.state === 'question') return renderStage();
    if(session.state === 'reveal') return renderStage();
    if(session.state === 'roundresults') return renderRoundResults();
    if(session.state === 'final') return renderFinal();
  }

  async function renderSetup(){
    let questions = await safeGet('quiz:questions', true) || [];
    if(questions.length === 0){
      for(let i=0;i<5;i++){
        questions.push({text:'', opts:{blue:'',red:'',yellow:'',green:''}, correct:'blue', double:false});
      }
    }
    questions.forEach(q => { if(typeof q.double === 'undefined') q.double = false; });

    function renderList(){
      const qlist = document.getElementById('qlist');
      qlist.innerHTML = '';
      questions.forEach((q, idx) => {
        const card = document.createElement('div');
        card.className = 'qcard';
        card.innerHTML = `
          <div class="qcard-head">
            <span class="qcard-num">سؤال ${idx+1}</span>
            <div style="display:flex; align-items:center; gap:14px;">
              <label style="display:flex; align-items:center; gap:6px; color:var(--gold); font-size:13px; font-weight:800; cursor:pointer;">
                <input type="checkbox" data-role="double" data-idx="${idx}" ${q.double ? 'checked':''} style="width:16px;height:16px; accent-color:var(--gold); cursor:pointer;">
                🔥 مضاعف ×2
              </label>
              <button class="chip-remove" data-role="removeQ" data-idx="${idx}" title="حذف السؤال">✕</button>
            </div>
          </div>
          <label>نص السؤال</label>
          <textarea rows="2" data-role="text" data-idx="${idx}" placeholder="اكتب نص السؤال هنا...">${escapeHtml(q.text)}</textarea>
          <div style="margin-top:10px; display:flex; flex-direction:column; gap:8px;">
            ${COLORS.map(c => `
              <div class="opt-row">
                <div class="opt-color c-${c}"></div>
                <input type="text" style="flex:1" data-role="opt" data-color="${c}" data-idx="${idx}" placeholder="إجابة ${labelColor(c)}" value="${escapeHtml(q.opts[c])}">
                <input type="radio" class="radio-correct" name="correct-${idx}" data-role="correct" data-color="${c}" data-idx="${idx}" ${q.correct===c ? 'checked':''} title="الإجابة الصحيحة">
              </div>
            `).join('')}
          </div>
        `;
        qlist.appendChild(card);
      });
      const addBtn = document.createElement('button');
      addBtn.className = 'btn ghost';
      addBtn.style.width = '100%';
      addBtn.style.marginTop = '6px';
      addBtn.textContent = '+ إضافة سؤال جديد';
      addBtn.addEventListener('click', ()=>{
        questions.push({text:'', opts:{blue:'',red:'',yellow:'',green:''}, correct:'blue', double:false});
        safeSet('quiz:questions', questions, true);
        renderList();
        updateProgress();
      });
      qlist.appendChild(addBtn);
    }

    app.innerHTML = `
      <div class="setup-wrap">
        <div class="setup-toolbar">
          <div class="logo-row">
            <span class="brand display-face">إعداد الأسئلة</span>
          </div>
          <div style="display:flex; gap:10px; align-items:center;">
            <span class="progress-pill" id="progressPill"></span>
            <button class="btn small ghost" id="startLobbyBtn">ابدأ اللعبة ▶</button>
          </div>
        </div>
        <div id="qlist"></div>
      </div>
    `;

    const qlist = document.getElementById('qlist');
    renderList();

    function updateProgress(){
      const filled = questions.filter(q => q.text.trim() && COLORS.every(c => q.opts[c].trim())).length;
      document.getElementById('progressPill').textContent = `${filled} / ${questions.length} سؤال جاهز`;
    }
    updateProgress();

    let saveTimeout = null;
    qlist.addEventListener('input', (e)=>{
      const t = e.target;
      const idx = parseInt(t.dataset.idx);
      if(t.dataset.role === 'text'){ questions[idx].text = t.value; }
      if(t.dataset.role === 'opt'){ questions[idx].opts[t.dataset.color] = t.value; }
      updateProgress();
      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(()=> safeSet('quiz:questions', questions, true), 400);
    });
    qlist.addEventListener('change', (e)=>{
      const t = e.target;
      if(t.dataset.role === 'correct'){
        questions[parseInt(t.dataset.idx)].correct = t.dataset.color;
        safeSet('quiz:questions', questions, true);
      }
      if(t.dataset.role === 'double'){
        questions[parseInt(t.dataset.idx)].double = t.checked;
        safeSet('quiz:questions', questions, true);
      }
    });
    qlist.addEventListener('click', (e)=>{
      const btn = e.target.closest('[data-role="removeQ"]');
      if(!btn) return;
      const idx = parseInt(btn.dataset.idx);
      if(questions.length <= 1){ alert('لازم يبقى سؤال واحد على الأقل.'); return; }
      questions.splice(idx, 1);
      safeSet('quiz:questions', questions, true);
      renderList();
      updateProgress();
    });

    document.getElementById('startLobbyBtn').addEventListener('click', async ()=>{
      const filled = questions.filter(q => q.text.trim() && COLORS.every(c => q.opts[c].trim())).length;
      if(filled === 0){ alert('أدخل سؤالاً واحدًا على الأقل قبل البدء.'); return; }
      await safeSet('quiz:questions', questions, true);
      await safeSet('quiz:players', {}, true);
      await safeSet('quiz:scores', {}, true);
      session = {state:'lobby', currentIndex:-1, questionStartedAt:null, revealed:false};
      await safeSet('quiz:session', session, true);
      route();
    });
  }

  async function pollLobby(){
    if(session.state !== 'lobby') return;
    const players = await safeGet('quiz:players', true) || {};
    const entries = Object.entries(players);
    const grid = document.getElementById('playersGrid');
    const countPill = document.getElementById('countPill');

        </div>
      `).join('');

    }

  async function startQuestion(index){
    const questions = await safeGet('quiz:questions', true) || [];
    const valid = questions.filter(q => q.text.trim());
    if(index >= valid.length){
      session = {state:'final', currentIndex:index, questionStartedAt:null, revealed:false};
      await safeSet('quiz:session', session, true);
      return route();
    }
    await safeSet('quiz:answers:'+index, {}, true);
    const queuedBoosts = await safeGet('quiz:bonusQueue', true) || {};
    await safeSet('quiz:activeBoosts', queuedBoosts, true);
    await safeSet('quiz:bonusQueue', {}, true);
    session = {state:'question', currentIndex:index, questionStartedAt: Date.now(), revealed:false};
    await safeSet('quiz:session', session, true);
    route();
  }

  let stageTimerInterval = null;
  let stagePollInterval = null;

  async function renderStage(){
    clearInterval(stageTimerInterval); clearInterval(stagePollInterval);
    const questions = (await safeGet('quiz:questions', true) || []).filter(q => q.text.trim());
    const idx = session.currentIndex;
    const q = questions[idx];
    if(!q){ session.state='final'; await safeSet('quiz:session', session, true); return route(); }

    const players = await safeGet('quiz:players', true) || {};
    const activeBoosts = await safeGet('quiz:activeBoosts', true) || {};
    const boostedNames = Object.keys(activeBoosts).map(pid => players[pid]?.name).filter(Boolean);

    app.innerHTML = `
      <div class="stage">
        <div class="stage-top">
          <span class="qnum">سؤال ${idx+1} من ${questions.length}</span>
          <span class="answered-pill" id="answeredPill">0 / 0 أجابوا</span>
          <button class="skip-btn" id="skipBtn">إنهاء السؤال الآن ⏭</button>
          <div class="timer-wrap">
            <div class="timer-ring" id="timerRing" style="--pct:100">
              <span class="timer-num display-face" id="timerNum">60</span>
            </div>
          </div>
        </div>
        ${q.double ? `<div class="boost-banner" style="background:rgba(255,59,78,.12); border-color:rgba(255,59,78,.4); color:var(--red);">🔥 سؤال مضاعف: كل النقاط ×2 لهذا السؤال!</div>` : ''}
        ${boostedNames.length ? `<div class="boost-banner">🎁 مضاعفة النقاط مفعّلة لـ: ${boostedNames.map(escapeHtml).join('، ')}</div>` : ''}
        <div class="qbox display-face">${escapeHtml(q.text)}</div>
        <div class="answers-grid" id="answersGrid">
          ${COLORS.map(c => `
            <div class="answer-tile tile-${c}" data-color="${c}">
              <span class="count-badge" id="cnt-${c}" style="opacity:0;">0</span>
              <div class="shape">${shapeSVG(c)}</div>
              <span>${escapeHtml(q.opts[c])}</span>
            </div>
          `).join('')}
        </div>
      </div>
    `;

    document.getElementById('skipBtn').addEventListener('click', async ()=>{
      clearInterval(stageTimerInterval); clearInterval(stagePollInterval);
      await revealAndScore(idx, q);
    });

    let lastBeepSecond = null;
    const startedAt = session.questionStartedAt;
    async function tick(){
      const elapsed = (Date.now() - startedAt) / 1000;
      const remaining = Math.max(0, QUESTION_TIME - elapsed);
      const pct = Math.round((remaining / QUESTION_TIME) * 100);
      const ring = document.getElementById('timerRing');
      const num = document.getElementById('timerNum');
      const secondsLeft = Math.ceil(remaining);
      if(ring){ ring.style.setProperty('--pct', pct); num.textContent = secondsLeft; }
      if(ring && remaining <= 10){ ring.style.background = `conic-gradient(${COLOR_HEX.red} calc(${pct}*1%), #e3e6f4 0)`; }
      if(secondsLeft <= 10 && secondsLeft > 0 && secondsLeft !== lastBeepSecond){
        lastBeepSecond = secondsLeft;
        playBeep(secondsLeft === 1 ? 1100 : 700, secondsLeft === 1 ? 0.25 : 0.1);
      }

      const answers = await safeGet('quiz:answers:'+idx, true) || {};
      const players = await safeGet('quiz:players', true) || {};
      const totalPlayers = Object.keys(players).length;
      const answeredCount = Object.keys(answers).length;
      const pill = document.getElementById('answeredPill');
      if(pill) pill.textContent = `${answeredCount} / ${totalPlayers} أجابوا`;

      const allAnswered = totalPlayers > 0 && answeredCount >= totalPlayers;
      if(remaining <= 0 || allAnswered){
        clearInterval(stageTimerInterval); clearInterval(stagePollInterval);
        await revealAndScore(idx, q);
      }
    }
    tick();
    stageTimerInterval = setInterval(tick, 500);
  }

  async function revealAndScore(idx, q){
    const answersForReveal = await safeGet('quiz:answers:'+idx, true) || {};
    const grid = document.getElementById('answersGrid');
    if(grid){
      grid.querySelectorAll('.answer-tile').forEach(tile => {
        const c = tile.dataset.color;
        const cntEl = document.getElementById('cnt-'+c);
        if(cntEl){
          const n = Object.values(answersForReveal).filter(a => a.choice === c).length;
          cntEl.textContent = n;
          cntEl.style.transition = 'opacity .4s ease';
          cntEl.style.opacity = '1';
        }
        if(c === q.correct) tile.classList.add('correct-reveal');
        else tile.classList.add('dim-reveal');
      });
    }
    await new Promise(r => setTimeout(r, 1800));

    const answers = await safeGet('quiz:answers:'+idx, true) || {};
    const players = await safeGet('quiz:players', true) || {};
    let scores = await safeGet('quiz:scores', true) || {};
    const activeBoosts = await safeGet('quiz:activeBoosts', true) || {};

    const correctAnswers = Object.entries(answers)
      .filter(([pid, a]) => a.choice === q.correct)
      .sort((a,b) => a[1].answeredAt - b[1].answeredAt);

    const n = correctAnswers.length;
    const deltas = {};
    correctAnswers.forEach(([pid, a], rank) => {
      let pts = n <= 1 ? 1000 : Math.round(1000 - (rank / (n)) * 500);
      if(q.double) pts = pts * 2;
      if(activeBoosts[pid]) pts = pts * 2;
      deltas[pid] = pts;
      scores[pid] = (scores[pid] || 0) + pts;
    });
    Object.keys(answers).forEach(pid => { if(!(pid in deltas)) deltas[pid] = 0; });
    Object.keys(players).forEach(pid => { if(!(pid in scores)) scores[pid] = scores[pid] || 0; });

    await safeSet('quiz:scores', scores, true);
    await safeSet('quiz:lastDeltas', deltas, true);
    await safeSet('quiz:activeBoosts', {}, true);

    session.state = 'roundresults';
    await safeSet('quiz:session', session, true);
    route();
  }

  async function renderRoundResults(){
    const players = await safeGet('quiz:players', true) || {};
    const scores = await safeGet('quiz:scores', true) || {};
    const deltas = await safeGet('quiz:lastDeltas', true) || {};
    const questions = (await safeGet('quiz:questions', true) || []).filter(q => q.text.trim());
    const idx = session.currentIndex;
    const isLast = idx >= questions.length - 1;
    const bonusUsed = await safeGet('quiz:bonusUsed', true) || {};
    const bonusQueue = await safeGet('quiz:bonusQueue', true) || {};

    const rows = Object.entries(players)
      .map(([pid, p]) => ({pid, name:p.name, total:scores[pid]||0, delta:deltas[pid]||0}))
      .sort((a,b) => b.total - a.total);

    let rankMoveMap = {};
    if(idx > 0){
      const prevOrder = rows.map(r => ({pid:r.pid, prevTotal: r.total - r.delta}))
        .sort((a,b) => b.prevTotal - a.prevTotal);
      const prevRank = {}; prevOrder.forEach((r,i) => { prevRank[r.pid] = i; });
      const curRank = {}; rows.forEach((r,i) => { curRank[r.pid] = i; });
      rows.forEach(r => { rankMoveMap[r.pid] = prevRank[r.pid] - curRank[r.pid]; });
    }

    app.innerHTML = `
      <div class="results-wrap">
        <span class="qnum">النتائج بعد سؤال ${idx+1}</span>
        <h1 class="title display-face">لوحة النقاط</h1>
        <div class="scoreboard" id="scoreboard"></div>
        ${!isLast && rows.length ? `
        <div class="scoreboard" id="bonusPanel">
          <span class="qnum" style="margin-bottom:4px;">🎁 بونص مضاعفة النقاط (للسؤال القادم)</span>
          ${rows.map(r => {
            const used = bonusUsed[r.pid] || 0;
            const remaining = 2 - used;
            const queued = !!bonusQueue[r.pid];
            const disabled = remaining <= 0 && !queued;
            return `
              <div class="score-row" style="justify-content:space-between;">
                <div class="score-name" style="flex:none; min-width:110px;">${escapeHtml(r.name)}</div>
                <button class="bonus-btn ${queued?'active':''}" data-pid="${r.pid}" ${disabled?'disabled':''}>
                  ${queued ? '✅ مفعّل - إلغاء' : `🎁 استخدام البونص (${remaining}/2)`}
                </button>
              </div>
            `;
          }).join('')}
        </div>
        ` : ''}
        <button class="btn" id="nextBtn">${isLast ? 'عرض النتيجة النهائية 🏆' : 'السؤال التالي ▶'}</button>
      </div>
    `;

    const board = document.getElementById('scoreboard');

    function buildRow(r, rankNum, startTotal){
      const div = document.createElement('div');
      div.className = 'score-row';
      div.dataset.pid = r.pid;
      div.innerHTML = `
        <div class="score-rank" id="rank-${r.pid}">${rankNum}</div>
        <div class="score-name">${escapeHtml(r.name)}</div>
        <div class="move-arrow" id="arrow-${r.pid}"></div>
        <div class="score-delta">${r.delta > 0 ? '+'+r.delta : '—'}</div>
        <div class="score-total display-face" id="total-${r.pid}">${startTotal}</div>
      `;
      return div;
    }

    function animateCount(el, from, to, duration){
      if(!el) return;
      const start = performance.now();
      function frame(now){
        const t = Math.min(1, (now-start)/duration);
        const eased = 1 - Math.pow(1-t, 3);
        el.textContent = Math.round(from + (to-from)*eased);
        if(t < 1) requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }

    if(rows.length === 0){
      board.innerHTML = '<div class="score-row"><div class="score-name">لا يوجد لاعبون</div></div>';
    } else if(idx === 0){
      rows.forEach((r,i) => board.appendChild(buildRow(r, i+1, r.total)));
    } else {
      const prevOrder = rows.map(r => ({...r, prevTotal: r.total - r.delta}))
        .sort((a,b) => b.prevTotal - a.prevTotal);
      prevOrder.forEach((r,i) => board.appendChild(buildRow(r, i+1, r.prevTotal)));

      await new Promise(res => setTimeout(res, 1800));

      const firstRects = {};
      board.querySelectorAll('.score-row').forEach(el => {
        firstRects[el.dataset.pid] = el.getBoundingClientRect();
      });

      prevOrder.forEach(r => {
        animateCount(document.getElementById('total-'+r.pid), r.prevTotal, r.total, 1400);
      });

      await new Promise(res => setTimeout(res, 1500));

      rows.forEach(r => {
        const el = board.querySelector(`[data-pid="${r.pid}"]`);
        if(el) board.appendChild(el);
      });
      rows.forEach((r,i) => {
        const rankEl = document.getElementById('rank-'+r.pid);
        const rowEl = board.querySelector(`[data-pid="${r.pid}"]`);
        if(rankEl) rankEl.textContent = i+1;
        if(rowEl) rowEl.classList.toggle('rank-1', i===0);
      });

      rows.forEach(r => {
        const el = board.querySelector(`[data-pid="${r.pid}"]`);
        if(!el) return;
        const last = el.getBoundingClientRect();
        const first = firstRects[r.pid];
        if(first){
          const dy = first.top - last.top;
          if(Math.abs(dy) > 1){
            el.style.transition = 'none';
            el.style.transform = `translateY(${dy}px)`;
            requestAnimationFrame(()=>{
              el.style.transition = 'transform 1100ms cubic-bezier(.22,.85,.25,1)';
              el.style.transform = 'translateY(0)';
            });
          }
        }
        const move = rankMoveMap[r.pid] || 0;
        const arrowEl = document.getElementById('arrow-'+r.pid);
        if(arrowEl){
          if(move > 0){ arrowEl.innerHTML = `▲<span style="font-size:15px;">${move}</span>`; arrowEl.style.color = 'var(--green)'; }
          else if(move < 0){ arrowEl.innerHTML = `▼<span style="font-size:15px;">${Math.abs(move)}</span>`; arrowEl.style.color = 'var(--red)'; }
          else { arrowEl.textContent = '—'; arrowEl.style.color = 'var(--dim)'; }
          arrowEl.style.opacity = '0';
          arrowEl.style.transform = 'scale(0.5)';
          requestAnimationFrame(()=>{
            arrowEl.style.transition = 'opacity 350ms ease, transform 350ms cubic-bezier(.34,1.56,.64,1)';
            arrowEl.style.opacity = '1';
            arrowEl.style.transform = 'scale(1)';
          });
        }
      });
    }

    const bonusPanel = document.getElementById('bonusPanel');
    if(bonusPanel){
      bonusPanel.addEventListener('click', async (e)=>{
        const btn = e.target.closest('.bonus-btn');
        if(!btn || btn.disabled) return;
        const pid = btn.dataset.pid;
        const curUsed = await safeGet('quiz:bonusUsed', true) || {};
        const curQueue = await safeGet('quiz:bonusQueue', true) || {};
        if(curQueue[pid]){
          delete curQueue[pid];
          curUsed[pid] = Math.max(0, (curUsed[pid]||0) - 1);
        } else {
          if((curUsed[pid]||0) >= 2) return;
          curUsed[pid] = (curUsed[pid]||0) + 1;
          curQueue[pid] = true;
        }
        await safeSet('quiz:bonusUsed', curUsed, true);
        await safeSet('quiz:bonusQueue', curQueue, true);
        renderRoundResults();
      });
    }
    document.getElementById('nextBtn').addEventListener('click', ()=> startQuestion(idx+1));
  }

  async function renderFinal(){
    const players = await safeGet('quiz:players', true) || {};
    const scores = await safeGet('quiz:scores', true) || {};
    const rows = Object.entries(players)
      .map(([pid, p]) => ({pid, name:p.name, total:scores[pid]||0}))
      .sort((a,b) => b.total - a.total);

    const [first, second, third, ...rest] = rows;
    app.innerHTML = `
      <div class="podium-wrap">
        <span class="brand display-face">🏆 النتيجة النهائية</span>
        <div class="podium" id="podium"></div>
        <div class="rest-list" id="restList"></div>
        <button class="btn ghost small hidden" id="restartBtn">لعبة جديدة (إعادة الإعداد)</button>
      </div>
    `;

    const podium = document.getElementById('podium');
    const restListEl = document.getElementById('restList');
    const restartBtn = document.getElementById('restartBtn');

    function podiumCol(r, place, cls, medal){
      return `
        <div class="podium-col ${cls} podium-reveal">
          <span class="medal">${medal}</span>
          <span class="podium-name">${escapeHtml(r.name)}</span>
          <span class="podium-score">${r.total} نقطة</span>
          <div class="podium-block display-face">${place}</div>
        </div>
      `;
    }

    function launchConfetti(){
      const container = document.createElement('div');
      container.style.cssText = 'position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:50;';
      document.body.appendChild(container);
      const colors = [COLOR_HEX.blue, COLOR_HEX.red, COLOR_HEX.yellow, COLOR_HEX.green, '#ffd166', '#ffffff'];
      for(let i=0;i<70;i++){
        const piece = document.createElement('div');
        const size = 6 + Math.random()*8;
        const left = Math.random()*100;
        const delay = Math.random()*0.6;
        const duration = 2.2 + Math.random()*1.6;
        const color = colors[Math.floor(Math.random()*colors.length)];
        const rotate = Math.random()*360;
        piece.style.cssText = `
          position:absolute; top:-5%; left:${left}%; width:${size}px; height:${size*0.5}px;
          background:${color}; opacity:.9; transform:rotate(${rotate}deg);
          animation: confettiFall ${duration}s ease-in ${delay}s forwards;
        `;
        container.appendChild(piece);
      }
      setTimeout(()=> container.remove(), 4500);
    }

    function playCheer(){
      const notes = [523.25, 659.25, 783.99, 1046.5, 1046.5];
      notes.forEach((f,i) => setTimeout(()=> playBeep(f, i===notes.length-1 ? 0.6 : 0.3), i*140));
    }

    restListEl.innerHTML = rest.map((r,i) => `
      <div class="score-row" style="opacity:0; animation: fadeInUp .5s ease forwards; animation-delay:${(i*0.1)+0.1}s;">
        <div class="score-rank">${i+4}</div>
        <div class="score-name">${escapeHtml(r.name)}</div>
        <div class="score-total display-face">${r.total}</div>
      </div>
    `).join('');

    await new Promise(res => setTimeout(res, rest.length ? 1600 : 500));

    if(third){
      podium.insertAdjacentHTML('beforeend', podiumCol(third,3,'p3','🥉'));
      await new Promise(res => setTimeout(res, 1500));
    }
    if(second){
      podium.insertAdjacentHTML('afterbegin', podiumCol(second,2,'p2','🥈'));
      await new Promise(res => setTimeout(res, 1500));
    }
    if(first){
      const firstHtml = podiumCol(first,1,'p1','🥇');
      const p2el = podium.querySelector('.podium-col.p2');
      if(p2el){ p2el.insertAdjacentHTML('afterend', firstHtml); }
      else { podium.insertAdjacentHTML('afterbegin', firstHtml); }
      const p1el = podium.querySelector('.podium-col.p1');
      if(p1el) p1el.classList.add('winner-pop');
      launchConfetti();
      playCheer();
    }

    restartBtn.classList.remove('hidden');
    restartBtn.addEventListener('click', async ()=>{
      if(!confirm('سيتم مسح اللاعبين والنقاط الحالية. متابعة؟')) return;
      await safeSet('quiz:players', {}, true);
      await safeSet('quiz:scores', {}, true);
      session = {state:'lobby', currentIndex:-1, questionStartedAt:null, revealed:false};
      await safeSet('quiz:session', session, true);
      route();
    });
  }
}

async function renderPlayerApp(){
  let playerId = sessionStorageFallback();
  function sessionStorageFallback(){
    if(window.__playerId) return window.__playerId;
    window.__playerId = uid();
    return window.__playerId;
  }

  let myName = null;
  renderJoin();

  function renderJoin(){
    app.innerHTML = `
      <div class="player-wrap">
        <div class="center-col">
          <div class="logo-row">
            <span class="logo-dot" style="background:${COLOR_HEX.blue}"></span>
            <span class="logo-dot" style="background:${COLOR_HEX.red}"></span>
            <span class="logo-dot" style="background:${COLOR_HEX.yellow}"></span>
            <span class="logo-dot" style="background:${COLOR_HEX.green}"></span>
          </div>
          <h1 class="title display-face">سجّل اسمك</h1>
          <p class="subtitle">اكتب اسمك كما تريد أن يظهر على الشاشة</p>
          <div style="max-width:320px; width:100%; display:flex; flex-direction:column; gap:14px;">
            <input type="text" id="nameInput" placeholder="مثال: خالد" maxlength="20">
            <button class="btn" id="joinBtn">دخول اللعبة ▶</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById('joinBtn').addEventListener('click', join);
    document.getElementById('nameInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') join(); });
  }

  async function join(){
    const val = document.getElementById('nameInput').value.trim();
    if(!val){ return; }
    myName = val;
    const players = await safeGet('quiz:players', true) || {};
    players[playerId] = {name: myName, joinedAt: Date.now()};
    await safeSet('quiz:players', players, true);
    renderWaitingLoop();
  }

  async function renderWaitingLoop(){
    let lastState = null;
    async function loop(){
      const session = await safeGet('quiz:session', true) || {state:'lobby'};
      if(session.state !== lastState){
        lastState = session.state;
        if(session.state === 'lobby' || session.state === 'setup'){
          renderWaiting();
        } else if(session.state === 'question'){
          renderColorButtons(session.currentIndex);
        } else if(session.state === 'reveal' || session.state === 'roundresults'){
          renderMyResult(session.currentIndex);
        } else if(session.state === 'final'){
          renderMyFinal();
        }
      }
      setTimeout(loop, 900);
    }
    loop();
  }

  function renderWaiting(){
    app.innerHTML = `
      <div class="player-wrap">
        <div class="waiting-box">
          <span class="player-name-tag">${escapeHtml(myName)}</span>
          <div class="pulse-dot"></div>
          <p class="subtitle">بانتظار بدء اللعبة على الشاشة الكبيرة...</p>
        </div>
      </div>
    `;
  }

  let hasAnsweredThisQ = false;

  async function renderColorButtons(idx){
    hasAnsweredThisQ = false;
    const answers = await safeGet('quiz:answers:'+idx, true) || {};
    if(answers[playerId]){ hasAnsweredThisQ = true; }

    if(hasAnsweredThisQ){ renderLocked(); return; }

    app.innerHTML = `
      <div class="player-wrap">
        <div class="colors-grid" id="colorsGrid">
          ${COLORS.map(c => `
            <button class="color-btn c-${c}" data-color="${c}">${shapeSVG(c)}</button>
          `).join('')}
        </div>
      </div>
    `;
    document.querySelectorAll('.color-btn').forEach(btn => {
      btn.addEventListener('click', async ()=>{
        if(hasAnsweredThisQ) return;
        hasAnsweredThisQ = true;
        const color = btn.dataset.color;
        const answers2 = await safeGet('quiz:answers:'+idx, true) || {};
        if(answers2[playerId]) { renderLocked(); return; }
        answers2[playerId] = {choice: color, answeredAt: Date.now()};
        await safeSet('quiz:answers:'+idx, answers2, true);
        renderLocked(color);
      });
    });
  }

  function renderLocked(chosenColor){
    app.innerHTML = `
      <div class="player-wrap">
        <div class="center-col">
          ${chosenColor ? `<div class="shape" style="width:70px;height:70px;background:${COLOR_HEX[chosenColor]};border-radius:16px;display:flex;align-items:center;justify-content:center;">${shapeSVG(chosenColor)}</div>` : ''}
          <p class="locked-msg">تم إرسال إجابتك ✓</p>
          <p class="subtitle">بانتظار باقي اللاعبين...</p>
        </div>
      </div>
    `;
  }

  async function renderMyResult(idx){
    const scores = await safeGet('quiz:scores', true) || {};
    const deltas = await safeGet('quiz:lastDeltas', true) || {};
    const myTotal = scores[playerId] || 0;
    const myDelta = deltas[playerId] || 0;
    app.innerHTML = `
      <div class="player-wrap">
        <div class="center-col">
          <span class="player-name-tag">${escapeHtml(myName)}</span>
          <h1 class="title display-face" style="color:${myDelta>0?'var(--green)':'var(--dim)'}">${myDelta>0 ? '+'+myDelta : '0 نقطة'}</h1>
          <p class="my-score">مجموعك الكلي: ${myTotal} نقطة</p>
          <p class="subtitle">شاهد الترتيب على الشاشة الكبيرة</p>
        </div>
      </div>
    `;
  }

  async function renderMyFinal(){
    const players = await safeGet('quiz:players', true) || {};
    const scores = await safeGet('quiz:scores', true) || {};
    const rows = Object.entries(players).map(([pid,p]) => ({pid, total:scores[pid]||0})).sort((a,b)=>b.total-a.total);
    const myRank = rows.findIndex(r => r.pid === playerId) + 1;
    const myTotal = scores[playerId] || 0;
    app.innerHTML = `
      <div class="player-wrap">
        <div class="center-col">
          <span class="brand display-face">انتهت اللعبة 🏁</span>
          <h1 class="title display-face">مركزك: ${myRank}</h1>
          <p class="my-score">مجموع نقاطك: ${myTotal}</p>
          <p class="subtitle">${escapeHtml(myName)}، شكراً لمشاركتك!</p>
        </div>
      </div>
    `;
  }
}

function labelColor(c){
  return {blue:'الأزرق', red:'الأحمر', yellow:'الأصفر', green:'الأخضر'}[c];
}
function escapeHtml(str){
  return String(str||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
</script>
</body>
</html>
